services:
  tanken:
    build: .
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      VIRTUAL_HOST: ${VIRTUAL_HOST:-tanken.local}
      VIRTUAL_PORT: ${VIRTUAL_PORT:-${PORT:-3000}}
      LETSENCRYPT_HOST: ${VIRTUAL_HOST:-tanken.local}
      DATABASE_URL: postgres://tanken:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@localhost:5432/tanken
      DATABASE_SOCKET: /var/run/postgresql/.s.PGSQL.5432
      ANWB_CLIENT_ID: ${ANWB_CLIENT_ID:-}
      ANWB_API_KEY: ${ANWB_API_KEY:-}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org/search}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-}
    expose:
      - "${PORT:-3000}"
    volumes:
      - postgres-socket:/var/run/postgresql:ro
    healthcheck:
      test: ["CMD", "bun", "run", "scripts/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      start_period: 30s
  postgres:
    image: postgres:18
    restart: unless-stopped
    network_mode: bridge
    environment:
      POSTGRES_USER: tanken
      POSTGRES_DB: tanken
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
    healthcheck:
      # Initialization briefly starts a socket-only server; wait for TCP readiness.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "tanken", "-d", "tanken"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  postgres-socket:
